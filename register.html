<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Golden Nature Boarding School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Golden <span>Nature</span></a>
            <div class="menu-toggle" id="mobile-menu">☰</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="faculty.html">Faculty</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="form-container">
        <h2 style="color: var(--primary); text-align: center; margin-bottom: 1.5rem;">Online Admission Inquiry</h2>
        <form>
            <div class="form-group">
                <label>Student Full Name</label>
                <input type="text" placeholder="Full name" required>
            </div>
            <div class="form-group">
                <label>Applying for Grade</label>
                <select required>
                    <option value="">Select Grade Level</option>
                    <option value="nursery">Nursery / Kindergarten</option>
                    <option value="basic">Basic Level (1 - 8)</option>
                    <option value="secondary">Secondary Level (9 - 10)</option>
                    <option value="plus2">Plus Two (+2 Management/Science)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Parent/Guardian Contact Number</label>
                <input type="tel" placeholder="+977-98xxxxxxxx" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="email@example.com" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Submit Application</button>
        </form>
    </div>

    <footer>
        <p>© 2026 Golden Nature Boarding School. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>

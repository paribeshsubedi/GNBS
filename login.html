<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Golden <span>Nature</span></a>
            <div class="menu-toggle" id="mobile-menu">☰</div>

    <div class="form-container">
        <h2 style="color: var(--primary); text-align: center; margin-bottom: 1.5rem;">Student / Parent Portal</h2>
        <form>
            <div class="form-group">
                <label>Email or User ID</label>
                <input type="text" placeholder="Enter ID" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="********" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Login</button>
            <p style="text-align: center; margin-top: 1rem;">Don't have an account? <a href="register.html" style="color: var(--primary);">Register here</a></p>
        </form>
    </div>

    <footer>
